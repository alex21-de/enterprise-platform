services:
  postgres:
    image: postgres:17
    container_name: postgres

    environment:
      POSTGRES_DB: EnterpriseDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: enterprise-api

    depends_on:
      - postgres

    ports:
      - "5000:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=EnterpriseDb;Username=postgres;Password=postgres

volumes:
  postgres-data: